name: CI Pipeline

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Python Tests (pytest)
  # ============================================
  pytest:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=pmoves_backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

  # ============================================
  # Jest Tests (Next.js Frontend)
  # ============================================
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmoves-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pmoves-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test:jest -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: pmoves-nextjs/coverage/lcov.info
          flags: javascript
          name: jest-coverage
          fail_ci_if_error: false

  # ============================================
  # TypeScript Type Check & Build
  # ============================================
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmoves-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pmoves-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================
  # Hardhat Contract Tests
  # ============================================
  hardhat:
    name: Hardhat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/solidity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/solidity/package-lock.json

      - name: Check for contracts directory
        id: check-contracts
        run: |
          if [ -f "package.json" ] && ([ -f "hardhat.config.ts" ] || [ -f "hardhat.config.js" ]); then
            echo "has_hardhat=true" >> $GITHUB_OUTPUT
          else
            echo "has_hardhat=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-contracts.outputs.has_hardhat == 'true'
        run: npm ci

      - name: Compile contracts
        if: steps.check-contracts.outputs.has_hardhat == 'true'
        run: npx hardhat compile

      - name: Run Hardhat tests
        if: steps.check-contracts.outputs.has_hardhat == 'true'
        run: npx hardhat test

      - name: Skip Hardhat (no contracts)
        if: steps.check-contracts.outputs.has_hardhat == 'false'
        run: echo "No Hardhat configuration found, skipping smart contract tests"

  # ============================================
  # Integration Tests (TypeScript)
  # ============================================
  integrations:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: integrations/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test -- --passWithNoTests

      - name: Type check CHIT modules
        run: npx tsc --noEmit contracts/chit/*.ts 2>/dev/null || true

  # ============================================
  # Accessibility Tests
  # ============================================
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmoves-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pmoves-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with accessibility tests
        run: npm run test:jest -- --testPathPattern="accessibility" --coverage --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: pmoves-nextjs/coverage/lcov.info
          flags: accessibility
          name: accessibility-coverage
          fail_ci_if_error: false

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: pmoves-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pmoves-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium 2>/dev/null || echo "E2E tests not configured"
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pmoves-nextjs/playwright-report/
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    outputs:
      npm_nextjs_critical: ${{ steps.npm-nextjs.outputs.critical }}
      npm_integrations_critical: ${{ steps.npm-integrations.outputs.critical }}
      python_critical: ${{ steps.python-audit.outputs.critical }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit npm packages (Next.js)
        id: npm-nextjs
        working-directory: pmoves-nextjs
        run: |
          echo "## Next.js Security Audit" >> $GITHUB_STEP_SUMMARY
          if npm audit --audit-level=critical 2>&1; then
            echo "critical=false" >> $GITHUB_OUTPUT
            echo "No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "Critical vulnerabilities detected - review required" >> $GITHUB_STEP_SUMMARY
          fi
          npm audit --audit-level=high || true

      - name: Audit npm packages (Integrations)
        id: npm-integrations
        working-directory: integrations
        run: |
          echo "## Integrations Security Audit" >> $GITHUB_STEP_SUMMARY
          if npm audit --audit-level=critical 2>&1; then
            echo "critical=false" >> $GITHUB_OUTPUT
            echo "No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "Critical vulnerabilities detected - review required" >> $GITHUB_STEP_SUMMARY
          fi
          npm audit --audit-level=high || true

      - name: Install safety for Python audit
        run: pip install safety

      - name: Audit Python packages
        id: python-audit
        run: |
          echo "## Python Security Audit" >> $GITHUB_STEP_SUMMARY
          if safety check -r requirements.txt 2>&1; then
            echo "critical=false" >> $GITHUB_OUTPUT
            echo "No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "Vulnerabilities detected - review required" >> $GITHUB_STEP_SUMMARY
          fi
          safety check -r requirements.txt --full-report || true

  # ============================================
  # Summary Job
  # ============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [pytest, jest, build, hardhat, integrations, accessibility, security]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.pytest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Jest Tests | ${{ needs.jest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hardhat Tests | ${{ needs.hardhat.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Tests | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Status" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Critical Issues |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Next.js npm | ${{ needs.security.outputs.npm_nextjs_critical == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integrations npm | ${{ needs.security.outputs.npm_integrations_critical == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.security.outputs.python_critical == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: needs.pytest.result == 'failure' || needs.jest.result == 'failure' || needs.build.result == 'failure'
        run: |
          echo "Critical jobs failed!"
          exit 1

      - name: Warn on critical security issues
        if: needs.security.outputs.npm_nextjs_critical == 'true' || needs.security.outputs.npm_integrations_critical == 'true' || needs.security.outputs.python_critical == 'true'
        run: |
          echo "::warning::Critical security vulnerabilities detected. Review the Security Audit job for details."
